<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>stage</title>
<style>
  html, body { margin: 0; background: #F6F0E5; overflow: hidden; }
  body { width: 1080px; height: 1440px; position: relative; }
  iframe { position: absolute; left: 0; top: 250px; width: 1080px; height: 1040px; border: 0; background: #F6F0E5; }
  .cap { position: absolute; left: 72px; right: 72px; top: 64px; color: #17324D; }
  .cap b { display: block; font-family: "Songti SC", "STSong", serif; font-size: 52px; line-height: 1.28; font-weight: 700; }
  .cap span { display: block; margin-top: 14px; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 42px; line-height: 1.35; color: #526477; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 48px; font-family: "PingFang SC", sans-serif; font-size: 32px; color: #526477; }
</style>
</head>
<body>
  <iframe id="model" title="甲状腺模型"></iframe>
  <div class="cap"><b id="line"></b><span id="sub"></span></div>
  <div class="foot">医学科普漫画 · 第 7 期 · 本内容仅供科普，不能替代医生诊疗</div>
<script>
const CUES = [{"t": 0.35, "text": "同样一个甲状腺出问题，两个人可能完全不一样。", "mode": "hyper"}, {"t": 4.47, "text": "一个人吃得多还瘦，心慌、手抖、怕热。", "mode": "hyper"}, {"t": 8.298, "text": "另一个人昏昏欲睡，怕冷、发胖、没精神。", "mode": "hyper"}, {"t": 12.432, "text": "一个是甲亢，一个是甲减，方向正好相反。", "mode": "hyper"}, {"t": 16.808, "text": "关键都在脖子前面这个小腺体：甲状腺。", "mode": "hyper"}, {"t": 21.001, "text": "它住在喉结下面，气管两旁，平时摸不着。", "mode": "hyper"}, {"t": 25.121, "text": "它分泌的激素，管全身的快慢：心跳、体温、消耗。", "mode": "hyper"}, {"t": 30.269, "text": "可以把激素想成油门，甲状腺就是踩油门的脚。", "mode": "hyper"}, {"t": 33.96, "text": "甲亢，是油门卡住了，一直往下踩。", "mode": "hyper"}, {"t": 37.937, "text": "激素太多，全身被迫加速。", "mode": "hyper"}, {"t": 41.057, "text": "心跳快、出汗多、吃得多还掉秤。", "mode": "hyper"}, {"t": 45.16, "text": "人容易急、容易慌，手会抖。", "mode": "hyper"}, {"t": 48.032, "text": "甲减，是脚几乎不踩了。", "mode": "hypo"}, {"t": 51.339, "text": "激素太少，全身慢下来。", "mode": "hypo"}, {"t": 53.951, "text": "怕冷、犯困、体重往上走，皮肤干，大便不通畅。", "mode": "hypo"}, {"t": 59.114, "text": "所以这两种病，症状像照镜子，一个太快，一个太慢。", "mode": "hypo"}, {"t": 64.45, "text": "但光靠感觉分不出来。", "mode": "hypo"}, {"t": 66.982, "text": "瘦、累、心慌，很多毛病都这样。", "mode": "hypo"}, {"t": 70.626, "text": "要抽血查甲状腺功能，看激素和促甲状腺激素的数。", "mode": "hypo"}, {"t": 75.766, "text": "确诊了也别慌，这两种病都有办法。", "mode": "hypo"}, {"t": 79.079, "text": "甲亢，是用药把油门压回去。", "mode": "hyper"}, {"t": 82.466, "text": "甲减，是每天吃一点药，把缺的补上。", "mode": "hypo"}, {"t": 85.657, "text": "量要医生按化验结果调，别自己加、自己停。", "mode": "hypo"}, {"t": 89.95, "text": "吃药期间定期复查，数变了，量才跟着变。", "mode": "hypo"}, {"t": 94.479, "text": "孕妇和备孕的人，甲状腺更要查，它关系孩子的发育。", "mode": "hypo"}, {"t": 99.952, "text": "脖子粗了、声音哑了、长肿块了，要尽快去查。", "mode": "hypo"}, {"t": 103.957, "text": "记住这一句：甲状腺是油门，甲亢是卡住，甲减是松垮。", "mode": "hyper"}, {"t": 109.27, "text": "本内容仅供科普，不能替代医生诊疗。", "mode": "hypo"}];
const frame = document.getElementById("model");
let booted = false;
let curMode = "";
function seek(t) {
  let i = 0;
  for (let k = 0; k < CUES.length; k++) if (t >= CUES[k].t) i = k;
  const cue = CUES[i];
  document.getElementById("line").textContent = cue.text;
  document.getElementById("sub").textContent = "";
  const mt = (t % 16).toFixed(3);
  if (!booted) {
    booted = true;
    curMode = cue.mode;
    frame.src = "http://127.0.0.1:5174/index.html?scene=1&capture=1&frame=portrait&mode=" + cue.mode + "&t=" + mt;
  } else {
    const win = frame.contentWindow;
    if (win && win.__setMode && cue.mode !== curMode) { curMode = cue.mode; win.__setMode(cue.mode); }
    if (win && win.__seek) win.__seek(mt);
  }
  document.title = "ready";
}
window.__seek = seek;
window.__DURATION = 114.38;
window.__ASSETS_PENDING = true;
frame.addEventListener("load", () => {
  const wait = () => {
    const win = frame.contentWindow;
    if (win && win.__SCENE_READY__) { window.__ASSETS_PENDING = false; return; }
    setTimeout(wait, 40);
  };
  wait();
});
seek(0);
</script>
</body>
</html>
